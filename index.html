<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Rocio ♡</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #fff5f7;
            color: #4a3038;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .heart {
            font-size: 55px;
        }

        h1 {
            font-size: 60px;
            margin: 20px 0 10px;
        }

        .subtitle {
            font-size: 20px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 25px;
            background: #d87991;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
            background: #c9637d;
        }

        footer {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="heart">♡</div>

        <h1>Five Months With You</h1>

        <p class="subtitle">
            for my favourite person in the entire world,<br>
            rocio :3
        </p>

        <a href="letter.html" class="button">
            a letter for you ♡
        </a>

    </div>

    <footer>
        made with love by your stupid boyfriend ♡
    </footer>

</body>
</html>
