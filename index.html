<title>For Rocio ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at 10% 10%, #ffd1e1 0%, transparent 25%),
        radial-gradient(circle at 90% 15%, #ffe0eb 0%, transparent 25%),
        radial-gradient(circle at 15% 90%, #ffd8e7 0%, transparent 30%),
        radial-gradient(circle at 85% 85%, #ffd0e1 0%, transparent 30%),
        #fff0f6;

    color: #542d3a;

    overflow-x: hidden;
}


/* ========================================
   FLOATING DECORATIONS
   ======================================== */

.decorations {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}


.decoration {
    position: absolute;

    user-select: none;

    animation:
        floatAround var(--duration) ease-in-out infinite,
        sway 4s ease-in-out infinite;

    filter:
        drop-shadow(0 4px 6px rgba(160, 70, 100, 0.18));

    opacity: 0.92;
}


.small {
    font-size: 20px;
}

.medium {
    font-size: 32px;
}

.large {
    font-size: 48px;
}

.huge {
    font-size: 65px;
}


/* ========================================
   MAIN PAGE
   ======================================== */

.hero {

    position: relative;

    z-index: 2;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 40px 25px;

}


/* ========================================
   HEART
   ======================================== */

.heart {

    font-size: 75px;

    animation:
        heartbeat 2s ease-in-out infinite;

    display: inline-block;

}


/* ========================================
   TITLE
   ======================================== */

h1 {

    font-size: clamp(45px, 9vw, 85px);

    margin: 20px 0 10px;

    color: #c94f75;

    text-shadow:
        3px 3px 0 #ffd3df,
        5px 5px 12px rgba(180, 70, 100, 0.15);

    animation:
        titleFloat 4s ease-in-out infinite;

}


.subtitle {

    font-size: 21px;

    max-width: 650px;

    line-height: 1.8;

    color: #965268;

    margin-bottom: 30px;

}


/* ========================================
   BUTTONS
   ======================================== */

.buttons {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 16px;

    margin-top: 10px;

}


.button {

    display: inline-block;

    width: 290px;

    padding: 16px 25px;

    background:
        linear-gradient(
            135deg,
            #ef7f9e,
            #d95d83
        );

    color: white;

    text-decoration: none;

    border-radius: 35px;

    font-size: 18px;

    border: 3px solid #ffd2df;

    box-shadow:
        0 10px 25px rgba(200, 70, 110, 0.22);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

}


.button:hover {

    transform:
        scale(1.08)
        rotate(-1deg);

    box-shadow:
        0 15px 30px rgba(200, 70, 110, 0.32);

}


/* ========================================
   ANIMATIONS
   ======================================== */

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

}


@keyframes titleFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }

}


@keyframes floatAround {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-40px)
            rotate(12deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

}


@keyframes sway {

    0%, 100% {
        margin-left: 0;
    }

    50% {
        margin-left: 18px;
    }

}


/* ========================================
   MOBILE
   ======================================== */

@media (max-width: 600px) {

    .hero {
        padding: 30px 20px;
    }

    .heart {
        font-size: 60px;
    }

    .button {
        width: min(290px, 90vw);
    }

    .decoration {
        transform: scale(0.8);
    }

}

</style>

</head>
